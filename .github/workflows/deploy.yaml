name: Build and upload to PyPi

on:
  push:
    tags:
      - "*"
  release:
    types:
      - published

jobs:
  testpypi_push:
    environment:
      name: deploy
      url: https://test.pypi.org/p/membrane-curvature
    permissions:
      id-token: write
    if: |
      github.repository == 'MDAnalysis/membrane-curvature' &&
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    name: Build, upload and test pure Python wheels to TestPyPi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install ".[tests]"

      - name: Run tests
        run: |
          pytest -v --cov=membrane_curvature --cov-report=xml --color=yes membrane_curvature/tests/

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: upload tests
        uses: pypa/gh-action-pypi-publish@v1.14.0

  pypi_push:
    environment:
      name: deploy
      url: https://pypi.org/p/membrane-curvature
    permissions:
      id-token: write
    if: |
      github.repository == 'MDAnalysis/membrane-curvature' &&
      (github.event_name == 'release' && github.event.action == 'published')
    name: Build, upload and test pure Python wheels to PyPi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install ".[tests]"

      - name: Run tests
        run: |
          pytest -v --cov=membrane_curvature --cov-report=xml --color=yes membrane_curvature/tests/

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@v1.14.0

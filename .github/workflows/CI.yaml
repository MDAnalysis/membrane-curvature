name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    # 3 am Tuesdays and Fridays
    - cron: "0 3 * * 2,5"

concurrency:
  group: "${{ github.ref }}-${{ github.head_ref }}"
  cancel-in-progress: true


jobs:
  pre-commit-check:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"
    - name: Install pre-commit
      run: python -m pip install pre-commit
    - name: Run pre-commit hooks
      run: pre-commit run --all-files --show-diff-on-failure

  ruff-check:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"
    - name: Install ruff
      run: python -m pip install ruff
    - name: Run ruff - check and show fixes
      run: ruff check . --show-fixes

  ty-check:
        name: Type check with ty
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
          with:
            python-version: "3.11"
        - name: Install package (deps for import resolution)
          run: python -m pip install .
        - name: Install ty
          run: python -m pip install ty
        - name: Run ty - check
          run: ty check

  uv-dev-check:
    name: Validate uv environment
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv and set Python 3.11
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.11"
    - name: Create uv env with dev dependency group
      run: uv sync --frozen --group dev
    - name: Run tests with uv
      run: uv run --frozen pytest

  test:
    name: "Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest, ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        env_file: [env, ]
        include:
          - name: minimum_requirements
            os: ubuntu-latest
            python-version: 3.11
            env_file: min

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Additional info about the build
      shell: bash
      run: |
        uname -a
        df -h
        ulimit -a

    # More info on options: https://github.com/conda-incubator/setup-miniconda
    # An environment for the minimum versions
    - name: setup micromamba
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
      with:
        environment-file: devtools/conda-envs/test_${{ matrix.env_file }}.yaml
        environment-name: test
        create-args: >-
          python=${{ matrix.python-version }}

    - name: Install package
      # conda setup requires this special shell
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps
        pip list
        micromamba list

    - name: Run tests
      # conda setup requires this special shell
      shell: bash -l {0}
      run: |
        pytest -v --cov=membrane_curvature --cov-report=xml --color=yes membrane_curvature/tests/

    - name: codecov
      if: ${{ github.repository == 'MDAnalysis/membrane-curvature' }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
        fail_ci_if_error: True
        verbose: True

  upstream_develop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        latest-python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.latest-python }}

    - name:  pip install membrane-curvature
      run: |
        pip install git+https://github.com/MDAnalysis/mdanalysis.git@develop#subdirectory=package
        python -m pip install .

    - name: install pytest
      run: |
        python -m pip install pytest

    - name: run tests
      run: |
        pytest --disable-pytest-warnings membrane_curvature/tests/

[build-system]
requires = ["setuptools", "versioningit"]
build-backend = "setuptools.build_meta"

[project]
name = "membrane_curvature"
dynamic = ["version"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
description = "MDAnalysis tool to calculate membrane curvature from MD simulations."
authors = [
    {name = "Estefania Barreto-Ojeda", email = "estefania@ojeda-e.com"},
]
maintainers = [
    {name = "Estefania Barreto-Ojeda", email = "estefania@ojeda-e.com"},
]
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "python", "biophysics", "molecular-dynamics",
    "molecular-simulation", "analysis",
    "trajectory-analysis",
]
dependencies = [
    'numpy>=1.23.0',
    'mdanalysis>=2.4.0'
]

classifiers = [
        'Development Status :: 5 - Production/Stable',
        'Environment :: Console',
        'Intended Audience :: Science/Research',
        'Operating System :: MacOS :: MacOS X',
        'Operating System :: Microsoft :: Windows',
        'Operating System :: POSIX',
        'Topic :: Scientific/Engineering',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Programming Language :: Python :: 3.14'
]

[dependency-groups]
tests = [
    "pytest",
    "pytest-cov",
    "MDAnalysisTests"
]
docs = [
    "ipython",
    "MDAnalysisData",
    "networkx",
    "widgetsnbextension",
    "mdanalysis-sphinx-theme",
    "sphinx-math-dollar",
    "nbsphinx",
    "ipywidgets",
    # pinning to latest working version of nglview in ipynb
    "nglview==4.0.0", # see https://github.com/nglviewer/nglview/issues/1172
    "myst-nb",
    "tidynamics",
]
dev = [
    "ruff",
    "validate-pyproject[all]",
    "pre-commit",
    "ty",
    {include-group = "tests"},
    {include-group = "docs"},
    ]

[tool.setuptools.packages.find]
include = ["membrane_curvature*"]

[project.urls]
Documentation = "https://membrane-curvature.readthedocs.io/en/latest/"
Code = "https://github.com/MDAnalysis/membrane-curvature"
Changelog = "https://github.com/MDAnalysis/membrane-curvature/blob/main/CHANGELOG.rst"
Issues = "https://github.com/MDAnalysis/membrane-curvature/issues"

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.vcs]
method = "git"
# the below line expects tags to look like '1.0.2'.
# if prefixing with a v, e.g. 'v1.0.2', change it to ["v*"]
match = ["*"]

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.coverage.run]
omit = [
    # Omit the tests
    "*/tests/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
exclude = [
	".bzr",
	".direnv",
	".eggs",
	".git",
    ".ipynb_checkpoints",
	".mypy_cache",
	".ruff_cache",
	".venv",
	"__pypackages__",
	"_build",
	"build",
	"dist",
	"venv",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E712", "F841"]

[tool.ruff.format]
quote-style = "single"
line-ending = "auto"

[tool.ty.rules]
unused-ignore-comment = "ignore"

[tool.ty.src]
include = ["membrane_curvature"]
exclude = ["**/docs/**", "**/tests/**"]
